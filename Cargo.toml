[package]
name = "matrix-wayland"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Matrix rain as a Wayland wallpaper (wlr-layer-shell + wl_shm)"

[dependencies]
smithay-client-toolkit = "0.21.1"
fontdue = "0.9.5"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
